services:
  ledger:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    volumes:
      - ./dev.db:/app/dev.db
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: "file:/app/dev.db"
      AUTH_SECRET: "changeme"
      AUTH_URL: "http://localhost:3000"
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    volumes:
      - ./dev.db:/app/dev.db
    environment:
      DATABASE_URL: "file:/app/dev.db"
    restart: "no"
